[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamebanana-mcp"
version = "0.1.0"
description = "Unofficial GameBanana API v11 MCP server for local stdio clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "pydantic>=2.7,<3"]

[project.scripts]
gamebanana-mcp = "gamebanana_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
